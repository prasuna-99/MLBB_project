<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Legend</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Loading Screen -->
    <div class="loader">
      <div class="loading-content">
        <!--progress bar-->
        <h1 class="percentage">0%</h1>

        <div class="progress-bar">
          <!--background track of progress bar-->
          <div class="progress"></div>
          <!--part that will grow-->
        </div>
      </div>
    </div>

    <!-- Main Website -->
    <main class="website">
      <h1>Welcome to Mobile Legend</h1>
    </main>

    <script src="script.js"></script>
    <!---The browser reads the <script> tag and starts executing script.js after the HTML is loaded-->
  </body>
</html>
