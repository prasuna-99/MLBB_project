<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Legend</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Loading Screen -->
    <div class="loader">
      <div class="loading-content">
        <!--progress bar-->
        <h1 class="percentage">0%</h1>

        <div class="progress-bar">
          <!--background track of progress bar-->
          <div class="progress"></div>
          <!--part that will grow-->
        </div>
      </div>
    </div>

    <!-- Main Website -->
    <main class="website">
      <video muted loop playsinline class="background-video" id="introVideo">
        <source src="images/1.benedetaa.mp4" type="video/mp4" />
      </video>

      <div class="website-content">
        <h1 class="animated-title">
          <span>M</span><span>o</span><span>b</span><span>i</span><span>l</span
          ><span>e</span>

          <span>L</span><span>e</span><span>g</span><span>e</span><span>n</span
          ><span>d</span>
        </h1>
      </div>
    </main>

    <script src="script.js"></script>
    <!---The browser reads the <script> tag and starts executing script.js after the HTML is loaded-->
  </body>
</html>
